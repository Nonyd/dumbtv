# dumbtv home (appletv fork) settings for the living-room Fire TV Stick.
# Pushed to /sdcard/Android/media/tv.dumbtv.home/home.conf; applied on the next return home.
accent=white
# shelf = picture across the top, apps in one row (home-grid.conf has the 3x3 grid look)
layout=shelf
columns=3
fit=on
focus=tilt
labels=focus
titles=off
clock=auto
clockside=right
memory=off
inputs=off
shortcuts=on
# adaptive = the background takes the focused app's colour
background=adaptive
dim=60
blur=strong
rotate=hourly
# home-screen photo slideshow after 3 idle minutes (the Stick's screen timeout is 5), 30 s per photo
idle=3
saver=30
lock=off
# Top shelf (net build): "popular on <app>" lists for this country. The TMDB key goes in its own
# file, tmdb.key, never in this file.
tmdb.region=NG
apps.only=com.netflix.ninja,com.amazon.firetv.youtube,com.amazon.firebat,com.disney.disneyplus,com.spotify.tv.android,com.plexapp.android,com.hbo.hbonow,com.tubitv.ott,tv.pluto.android
